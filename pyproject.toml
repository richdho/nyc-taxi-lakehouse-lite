[project]
name = "nyc-taxi-lakehouse-lite"
version = "0.1.0"
description = "Lightweight NYC TLC lakehouse (DuckDB, Iceberg, dlt, dbt, Dagster) — no Docker"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.35.0",
    "dlt[duckdb]>=1.4.0",
    "duckdb>=1.1.0",
    "polars>=1.12.0",
    "pyarrow>=17.0.0",
    "pyiceberg>=0.7.0",
    "requests>=2.32.0",
    "pyyaml>=6.0.2",
    "dagster>=1.9.0",
    "dagster-webserver>=1.9.0",
    "pandera>=0.20.0",
]

[project.optional-dependencies]
dbt = [
    "dbt-core>=1.8.0",
    "dbt-duckdb>=1.8.0",
]
dev = [
    "pre-commit>=4.0.0",
    "pytest>=8.3.0",
    "ruff>=0.8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lakehouse"]
