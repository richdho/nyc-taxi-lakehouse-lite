version: 2

models:
  - name: dim_date
    description: Calendar dimension covering all pickup dates present in silver trips.
    columns:
      - name: date_key
        description: Primary key (calendar date).
        tests:
          - unique
          - not_null
      - name: year
        tests:
          - not_null

  - name: dim_zone
    description: TLC taxi zone lookup (pickup/dropoff zone attributes).
    columns:
      - name: zone_key
        description: TLC LocationID.
        tests:
          - unique
          - not_null
      - name: borough
        tests:
          - not_null
      - name: zone_name
        tests:
          - not_null

  - name: fact_trips
    description: Trip-level fact table for yellow taxi analytics.
    columns:
      - name: trip_sk
        description: Surrogate key (hash of trip attributes).
        tests:
          - unique
          - not_null
      - name: date_key
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_key
      - name: pickup_zone_key
        tests:
          - relationships:
              arguments:
                to: ref('dim_zone')
                field: zone_key
      - name: dropoff_zone_key
        tests:
          - relationships:
              arguments:
                to: ref('dim_zone')
                field: zone_key
      - name: total_amount
        tests:
          - not_null

seeds:
  - name: taxi_zone_lookup
    description: Official TLC taxi zone lookup (LocationID → borough, zone name).
    columns:
      - name: LocationID
        tests:
          - unique
          - not_null
